name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check linked issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_issue.py
      - name: Install and check backend
        run: |
          pip install -r backend/requirements.txt
          ruff check --config backend/pyproject.toml backend scripts
          ruff format --config backend/pyproject.toml --check backend scripts
          python scripts/check_architecture.py
          python scripts/export_openapi.py --check
          pytest -q scripts/tests
      - name: Install and check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run api:check
          npm run format:check
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: Prepare fictional test account
        run: python scripts/setup.py --test
      - name: Build and deploy local test stack
        run: |
          docker compose --profile test up --build -d
          python scripts/wait_for_app.py
      - name: Backend integration tests with disposable PostgreSQL
        run: docker compose run --rm backend pytest -q
      - name: Browser tests against real OAuth and API
        working-directory: frontend
        run: npm run test:e2e
      - name: Restart application and verify persistence
        run: |
          docker compose restart backend db identity
          python scripts/wait_for_app.py
          EXPECT_PERSISTENCE=1 npm --prefix frontend run test:e2e
      - name: Package validated application images
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts
          docker tag "$(docker compose images -q backend)" "family-planner-backend:${GITHUB_SHA}"
          docker tag "$(docker compose images -q frontend)" "family-planner-frontend:${GITHUB_SHA}"
          docker save "family-planner-backend:${GITHUB_SHA}" "family-planner-frontend:${GITHUB_SHA}" | gzip > artifacts/family-planner-images.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main'
        with:
          name: family-planner-${{ github.sha }}
          path: artifacts/family-planner-images.tar.gz
          retention-days: 7
      - name: Stop test services
        if: always()
        run: docker compose --profile test down -v

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Format and validate infrastructure without AWS login
        run: |
          terraform fmt -check -recursive infra
          for root in infra/bootstrap infra/modules/application infra/environments/preview infra/environments/production; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
      - name: Infrastructure tests with simulated AWS provider
        run: |
          terraform -chdir=infra/bootstrap test
          terraform -chdir=infra/modules/application test
          node --test infra/tests/spa.test.mjs

  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, terraform]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Verify deployment configuration
        run: |
          test -n "$AWS_ACCOUNT_ID" || { echo 'Repository variable AWS_ACCOUNT_ID is required.' >&2; exit 1; }
          test -n "$AWS_REGION" || { echo 'Repository variable AWS_REGION is required.' >&2; exit 1; }
      - uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v4.2.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/family-planner-preview-github-actions
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        run: |
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable Lambda image
        id: image
        run: |
          repository="${{ steps.ecr.outputs.registry }}/family-planner-preview"
          tag="sha-${GITHUB_SHA}"
          docker build --platform linux/amd64 -f backend/Dockerfile.lambda -t "$repository:$tag" .
          docker push "$repository:$tag"
          digest=$(aws ecr describe-images --region "$AWS_REGION" --repository-name family-planner-preview --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
          echo "uri=$repository@$digest" >> "$GITHUB_OUTPUT"
      - name: Apply preview infrastructure for the validated image
        run: |
          cat > infra/environments/preview/terraform.tfvars <<EOF
          aws_account_id = "$AWS_ACCOUNT_ID"
          aws_region = "$AWS_REGION"
          EOF
          terraform -chdir=infra/environments/preview init -input=false \
            -backend-config="bucket=family-planner-${AWS_ACCOUNT_ID}-terraform-state" \
            -backend-config="key=preview/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="allowed_account_ids=[\"$AWS_ACCOUNT_ID\"]" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/environments/preview plan -input=false -out=preview.tfplan \
            -var="lambda_image_uri=${{ steps.image.outputs.uri }}"
          terraform -chdir=infra/environments/preview apply -input=false -auto-approve preview.tfplan
      - name: Publish the validated frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          bucket=$(terraform -chdir=../infra/environments/preview output -raw frontend_bucket)
          distribution=$(terraform -chdir=../infra/environments/preview output -raw cloudfront_distribution_id)
          aws cloudfront wait distribution-deployed --id "$distribution"
          aws s3 sync dist/ "s3://$bucket/" --exclude index.html --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp dist/index.html "s3://$bucket/index.html" --content-type text/html --cache-control 'no-cache'
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*'
      - name: Ensure the synthetic preview family and calendar
        run: |
          runtime=$(terraform -chdir=infra/environments/preview output -json runtime_config)
          user_pool_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["user_pool_id"])' <<< "$runtime")
          client_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["client_id"])' <<< "$runtime")
          secret_arn=$(terraform -chdir=infra/environments/preview output -raw preview_test_secret_arn)
          api_url=$(terraform -chdir=infra/environments/preview output -raw api_url)
          timezone=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["timezone"])' <<< "$runtime")
          python3 scripts/seed_preview.py --region "$AWS_REGION" --user-pool-id "$user_pool_id" \
            --client-id "$client_id" --secret-arn "$secret_arn" --api-url "$api_url" --timezone "$timezone"
